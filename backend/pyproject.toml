[project]
name = "bidradar-backend"
version = "0.1.0"
description = "BidRadar backend: FastAPI API, Celery workers, source adapters and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pgvector>=0.3,<1",
  "pyjwt>=2.8,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "structlog>=24,<26",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "freezegun>=1.5,<2",
  "pyyaml>=6,<7",
  "types-pyyaml>=6",
  "respx>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "N", "RUF", "ASYNC", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"migrations/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "celery.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-ra -q"

[tool.coverage.run]
branch = false
source = ["app/core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
