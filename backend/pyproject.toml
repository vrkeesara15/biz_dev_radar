[project]
name = "bidradar-backend"
version = "0.1.0"
description = "BidRadar backend: FastAPI API, Celery workers, source adapters and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pgvector>=0.3,<1",
  "pyjwt>=2.8,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "structlog>=24,<26",
  "cryptography>=43,<47",
  "python-multipart>=0.0.9,<1",
  "aiobotocore>=2.15,<3",
  "google-cloud-storage>=2.18,<4",
  "pymupdf>=1.28.2",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "pytesseract>=0.3.13",
  "anthropic>=1.8.0",
  "pyyaml>=6,<7",
  "sentry-sdk[fastapi]>=2.20,<3",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-instrumentation-celery>=0.50b0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "freezegun>=1.5,<2",
  "types-pyyaml>=6",
  "respx>=0.21,<1",
  "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "N", "RUF", "ASYNC", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"migrations/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = [
  "pgvector.*",
  "celery.*",
  "asyncpg.*",
  "aiobotocore.*",
  "botocore.*",
  "google.*",
  "pytesseract.*",
  "langfuse.*",
  "kombu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# adapter contract tests live in tests/adapters/contract.py (SPEC 12)
python_files = ["test_*.py", "contract.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # PyMuPDF's SWIG bindings emit these at import on Python 3.12; not ours
  "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
addopts = "-ra -q"

[tool.coverage.run]
branch = false
source = ["app/core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
