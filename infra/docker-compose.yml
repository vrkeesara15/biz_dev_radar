# Local stack (SPEC section 12). Host ports avoid common collisions:
#   postgres 5433, redis 6380, minio 9000/9001, mailpit 8025 (UI) / 1025 (SMTP)
name: bidradar

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bidradar
      POSTGRES_PASSWORD: bidradar
      POSTGRES_DB: bidradar
      # app role created by init script; keep in sync with .env.example
      BIDRADAR_APP_PASSWORD: bidradar_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidradar -d bidradar"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object store. MinIO stopped publishing public images in 2026;
    # RustFS is API-compatible (same ports, same credentials pattern).
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || curl -sf http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
