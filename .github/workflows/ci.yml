name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.14"
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - run: make lint
      # M7-12: the docs link checker. No database, so it belongs with the lint job and
      # fails fast: broken links, an unlisted runbook, or a README env table that no
      # longer matches app/core/config.py.
      - name: docs-links
        working-directory: backend
        run: uv run pytest tests/unit/test_docs_links.py -q

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidradar
          POSTGRES_PASSWORD: bidradar
          POSTGRES_DB: bidradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidradar -d bidradar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar
      DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar
      TEST_DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar_test
      TEST_DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - name: Create roles, databases and extensions (same SQL as the compose init)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGHOST=localhost PGPORT=5432 POSTGRES_USER=bidradar POSTGRES_PASSWORD=bidradar \
            BIDRADAR_APP_PASSWORD=bidradar_app bash infra/postgres/01-init.sh
      # make test = alembic upgrade head + pytest --cov=app/core --cov-fail-under=85
      - run: make test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  backend-isolation:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidradar
          POSTGRES_PASSWORD: bidradar
          POSTGRES_DB: bidradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidradar -d bidradar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar
      DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar
      TEST_DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar_test
      TEST_DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - name: Create roles, databases and extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGHOST=localhost PGPORT=5432 POSTGRES_USER=bidradar POSTGRES_PASSWORD=bidradar \
            BIDRADAR_APP_PASSWORD=bidradar_app bash infra/postgres/01-init.sh
      - name: Cross-tenant isolation suite (SPEC section 12)
        run: make isolation

  frontend-lint-build:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # M7-13 (SPEC 12 "UI: Playwright flows ... axe accessibility check"): the
      # five flows and the axe sweep need a real browser. `--with-deps` installs
      # the system libraries the GitHub runner image does not ship.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright flows and axe accessibility checks
        run: pnpm e2e
        env:
          E2E_REQUIRE_BROWSER: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # M7-01: both images must build on every PR. No push and no registry auth here — the
  # deploy workflow builds and pushes the image that actually ships (M7-03).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          tags: bidradar-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # M7-02: HCL must be formatted and every environment must resolve its modules.
  # `-backend=false` means no GCP credentials are needed to check the configuration.
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: terraform validate per environment
        run: |
          set -euo pipefail
          for env_dir in envs/*/; do
            echo "::group::${env_dir}"
            terraform -chdir="${env_dir}" init -backend=false -input=false -no-color
            terraform -chdir="${env_dir}" validate -no-color
            echo "::endgroup::"
          done

  # M7-06 (SPEC 11): dependency scanning and secrets scanning on every PR. Dependabot
  # (.github/dependabot.yml) proposes the upgrades; this job is what fails the build when
  # a known vulnerability is still in the lockfile.
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: pip-audit (backend runtime dependencies)
        working-directory: backend
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict --progress-spinner off

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm audit (frontend dependencies)
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=high

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
