name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.14"
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - run: make lint

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidradar
          POSTGRES_PASSWORD: bidradar
          POSTGRES_DB: bidradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidradar -d bidradar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar
      DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar
      TEST_DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar_test
      TEST_DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - name: Create roles, databases and extensions (same SQL as the compose init)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGHOST=localhost PGPORT=5432 POSTGRES_USER=bidradar POSTGRES_PASSWORD=bidradar \
            BIDRADAR_APP_PASSWORD=bidradar_app bash infra/postgres/01-init.sh
      # make test = alembic upgrade head + pytest --cov=app/core --cov-fail-under=85
      - run: make test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  backend-isolation:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidradar
          POSTGRES_PASSWORD: bidradar
          POSTGRES_DB: bidradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidradar -d bidradar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar
      DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar
      TEST_DATABASE_URL: postgresql+asyncpg://bidradar_app:bidradar_app@localhost:5432/bidradar_test
      TEST_DATABASE_URL_OWNER: postgresql+asyncpg://bidradar:bidradar@localhost:5432/bidradar_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - name: Create roles, databases and extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGHOST=localhost PGPORT=5432 POSTGRES_USER=bidradar POSTGRES_PASSWORD=bidradar \
            BIDRADAR_APP_PASSWORD=bidradar_app bash infra/postgres/01-init.sh
      - name: Cross-tenant isolation suite (SPEC section 12)
        run: make isolation

  frontend-lint-build:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
