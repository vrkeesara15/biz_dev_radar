name: preview

# SPEC 10.1 IaC row: "preview env per PR". A preview is not a new environment — it is a
# TAGGED, ZERO-TRAFFIC revision of the dev services, reachable at
# https://pr-<n>---bidradar-dev-api-<hash>.run.app while production traffic on those same
# services never moves. That is what makes it cheap enough to have on every PR, and what
# makes teardown a one-line tag removal.
#
# The database is shared with dev on purpose: a per-PR Cloud SQL instance would cost more
# than the feature it reviews, and migrations already have to be backward compatible for
# the deploy pipeline (schema first, traffic second). A PR whose migration is destructive
# must say so and be reviewed without a preview.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  REGISTRY_REGION: us-east1
  REPOSITORY: bidradar
  NAME_PREFIX: bidradar-dev
  REGION: us-east1

jobs:
  # Forks cannot mint an OIDC token for our project, and we would not want them to.
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: preview
      url: ${{ steps.urls.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT }}

      - run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_DEV_PROJECT }}/${{ env.REPOSITORY }}/backend:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-pr

      - name: Build and push the front-end image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.DEV_API_BASE_URL }}
          tags: ${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_DEV_PROJECT }}/${{ env.REPOSITORY }}/frontend:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-pr

      # --no-traffic: the tagged revision is reachable by its own URL and by nothing else.
      # No migration job runs for a preview; it shares dev's schema (see the header).
      - name: Deploy tagged revisions with no traffic
        id: urls
        env:
          TAG: pr-${{ github.event.pull_request.number }}
          BASE: ${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_DEV_PROJECT }}/${{ env.REPOSITORY }}
        run: |
          set -euo pipefail
          BACKEND="${BASE}/backend@${{ steps.backend.outputs.digest }}"
          FRONTEND="${BASE}/frontend@${{ steps.frontend.outputs.digest }}"

          gcloud run deploy "${NAME_PREFIX}-api" \
            --region "${REGION}" --image "${BACKEND}" \
            --tag "${TAG}" --no-traffic --quiet
          gcloud run deploy "${NAME_PREFIX}-web" \
            --region "${REGION}" --image "${FRONTEND}" \
            --tag "${TAG}" --no-traffic --quiet

          api_url=$(gcloud run services describe "${NAME_PREFIX}-api" --region "${REGION}" \
            --format "value(status.traffic.url.list())" | tr ';' '\n' | grep -- "${TAG}---" | head -1)
          web_url=$(gcloud run services describe "${NAME_PREFIX}-web" --region "${REGION}" \
            --format "value(status.traffic.url.list())" | tr ';' '\n' | grep -- "${TAG}---" | head -1)
          echo "api_url=${api_url}" >> "$GITHUB_OUTPUT"
          echo "web_url=${web_url}" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URLs on the PR
        uses: actions/github-script@v7
        env:
          WEB_URL: ${{ steps.urls.outputs.web_url }}
          API_URL: ${{ steps.urls.outputs.api_url }}
        with:
          script: |
            const marker = '<!-- bidradar-preview -->';
            const body = [
              marker,
              `### Preview for \`pr-${context.issue.number}\``,
              '',
              `| | |`,
              `| --- | --- |`,
              `| app | ${process.env.WEB_URL} |`,
              `| api | ${process.env.API_URL}/healthz |`,
              `| commit | \`${context.payload.pull_request.head.sha.slice(0, 12)}\` |`,
              '',
              'A zero-traffic revision of the **dev** services, sharing the dev database.',
              'It is removed when this PR closes.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT }}

      # Removing the tag makes the revision unreachable and lets Cloud Run garbage-collect
      # it. Untagged images are deleted by the Artifact Registry cleanup policy (M7-02).
      - name: Remove the preview tag
        env:
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for service in api web; do
            gcloud run services update-traffic "${NAME_PREFIX}-${service}" \
              --region "${REGION}" --remove-tags "${TAG}" --quiet || \
              echo "no ${TAG} tag on ${NAME_PREFIX}-${service}; nothing to remove"
          done

      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- bidradar-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n### Preview for \`pr-${context.issue.number}\`\n\nTorn down: the revision tag was removed when this PR closed.`,
              });
            }
